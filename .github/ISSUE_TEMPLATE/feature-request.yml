name: Feature request
description: Propose a scoped addition to S11tnext.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or risk, not only the proposed API.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Runtime
        - CLI and authoring
        - Schema or generated artifact
        - Documentation or integration
        - Release engineering
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
      description: Note migration, deterministic-output, trust-boundary, and portability effects.
    validations:
      required: true
